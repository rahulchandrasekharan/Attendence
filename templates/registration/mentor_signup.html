{% extends "base.html" %}
{% block title %}Mentor sign up{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto">
  <h1>Mentor sign up</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="small muted" style="margin-top:1rem">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
